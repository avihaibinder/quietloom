<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quietloom — audio engine harness</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 18px 18px 60px;
        background: #06080d;
        color: #d8dee9;
        font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: 0.04em; }
      .sub { color: #6b7688; margin: 0 0 18px; font-size: 12px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
      button {
        background: #161d2b; color: #d8dee9; border: 1px solid #263148;
        border-radius: 7px; padding: 7px 13px; font: inherit; cursor: pointer;
      }
      button:hover { background: #1e2739; }
      button.on { background: #2b4a7a; border-color: #3d6bad; color: #eaf1ff; }
      .panel {
        border: 1px solid #1b2333; border-radius: 9px; padding: 12px 14px;
        margin-bottom: 10px; background: #0b0f17;
      }
      .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
      .row label { min-width: 96px; color: #8a94a6; font-size: 12px; }
      .layer-head { display: flex; align-items: center; gap: 10px; }
      .layer-head strong { min-width: 92px; font-weight: 600; }
      input[type='range'] { flex: 1; min-width: 120px; accent-color: #4d84d6; }
      .val { min-width: 58px; text-align: right; color: #6b7688; font-size: 12px; }
      .readout { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
      .phase-track {
        position: relative; flex: 1; min-width: 200px; height: 22px;
        background: #10161f; border-radius: 11px; overflow: hidden;
      }
      .phase-fill { position: absolute; inset: 0 auto 0 0; background: #2b4a7a; width: 0; }
      .phase-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #7fb2ff; left: 50%; }
      .note { color: #57607200; }
      .hint { color: #576072; font-size: 12px; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <h1>Quietloom audio engine harness</h1>
    <p class="sub">Standalone dev page. Not part of the production build — vite only bundles index.html.</p>

    <div class="bar">
      <button id="btn-start">start()</button>
      <button id="btn-stop">stop()</button>
      <button id="btn-chime">playChime()</button>
      <button id="btn-fade">fadeMasterTo(0, 5)</button>
      <button id="btn-unfade">fadeMasterTo(master, 2)</button>
      <button id="btn-nursery">nursery cap: off</button>
      <button id="btn-allout">all layers off</button>
    </div>

    <div class="panel">
      <div class="row">
        <label for="master">master</label>
        <input id="master" type="range" min="0" max="100" value="70" />
        <span class="val" id="master-val">0.70</span>
      </div>
      <div class="row readout">
        <label>oceanPhase</label>
        <div class="phase-track"><div class="phase-fill" id="phase-fill"></div><div class="phase-mark"></div></div>
        <span class="val" id="phase-val">0.000</span>
      </div>
      <p class="hint">
        0 = trough / start of inhale, 0.5 = crest / start of exhale. Marker is the crest. One full
        sweep must take exactly 10.000 s.
      </p>
      <div class="row readout">
        <label>state</label>
        <span class="val" id="state-val" style="min-width: 260px; text-align: left"></span>
      </div>
    </div>

    <div id="layers"></div>

    <script type="module">
      import { engine, SOUND_IDS, LAYER_DEFAULTS } from '/src/audio/engine.js';
      import { bus } from '/src/core/bus.js';

      const PARAM_SPECS = {
        'rain.intensity': { min: 0, max: 1, step: 0.01 },
        'thunder.frequency': { min: 0, max: 1, step: 0.01 },
        'binaural.baseHz': { min: 100, max: 400, step: 1 },
        'binaural.beatHz': { min: 0.25, max: 16, step: 0.25 },
      };

      const host = document.getElementById('layers');
      const toggles = {};

      for (const id of SOUND_IDS) {
        const def = LAYER_DEFAULTS[id];
        const panel = document.createElement('div');
        panel.className = 'panel';

        const head = document.createElement('div');
        head.className = 'layer-head';
        const toggle = document.createElement('button');
        toggle.textContent = 'off';
        toggle.style.minWidth = '52px';
        const name = document.createElement('strong');
        name.textContent = id;
        const vol = document.createElement('input');
        vol.type = 'range';
        vol.min = 0;
        vol.max = 100;
        vol.value = Math.round(def.volume * 100);
        const volVal = document.createElement('span');
        volVal.className = 'val';
        volVal.textContent = def.volume.toFixed(2);

        toggle.addEventListener('click', () => {
          const next = !engine.getState().layers[id].enabled;
          engine.setLayerEnabled(id, next);
        });
        vol.addEventListener('input', () => {
          const v = Number(vol.value) / 100;
          volVal.textContent = v.toFixed(2);
          engine.setLayerVolume(id, v);
        });

        head.append(toggle, name, vol, volVal);
        panel.append(head);
        toggles[id] = toggle;

        for (const [pname, pval] of Object.entries(def.params)) {
          const spec = PARAM_SPECS[`${id}.${pname}`];
          if (!spec) continue;
          const row = document.createElement('div');
          row.className = 'row';
          const label = document.createElement('label');
          label.textContent = pname;
          const slider = document.createElement('input');
          slider.type = 'range';
          slider.min = spec.min;
          slider.max = spec.max;
          slider.step = spec.step;
          slider.value = pval;
          const out = document.createElement('span');
          out.className = 'val';
          out.textContent = String(pval);
          slider.addEventListener('input', () => {
            const v = Number(slider.value);
            out.textContent = String(v);
            engine.setLayerParam(id, pname, v);
          });
          row.append(label, slider, out);
          panel.append(row);
        }

        host.append(panel);
      }

      const masterSlider = document.getElementById('master');
      const masterVal = document.getElementById('master-val');
      masterSlider.addEventListener('input', () => {
        engine.setMasterVolume(Number(masterSlider.value) / 100);
      });

      document.getElementById('btn-start').addEventListener('click', () => engine.start());
      document.getElementById('btn-stop').addEventListener('click', () => engine.stop());
      document.getElementById('btn-chime').addEventListener('click', () => engine.playChime());
      document.getElementById('btn-fade').addEventListener('click', () => engine.fadeMasterTo(0, 5));
      document
        .getElementById('btn-unfade')
        .addEventListener('click', () => engine.fadeMasterTo(engine.getState().master, 2));

      const nurseryBtn = document.getElementById('btn-nursery');
      nurseryBtn.addEventListener('click', () => {
        engine.setNurserySafe(!engine.isNurserySafe());
        nurseryBtn.textContent = `nursery cap: ${engine.isNurserySafe() ? 'on' : 'off'}`;
        nurseryBtn.classList.toggle('on', engine.isNurserySafe());
      });

      document.getElementById('btn-allout').addEventListener('click', () => {
        engine.applyMix({ layers: {} });
      });

      const stateVal = document.getElementById('state-val');
      function render(state) {
        masterVal.textContent = state.master.toFixed(2);
        masterSlider.value = Math.round(state.master * 100);
        const on = [];
        for (const id of SOUND_IDS) {
          const enabled = state.layers[id].enabled;
          toggles[id].textContent = enabled ? 'on' : 'off';
          toggles[id].classList.toggle('on', enabled);
          if (enabled) on.push(id);
        }
        stateVal.textContent = `running=${state.running} · ctx=${
          engine.getContext()?.state ?? 'none'
        } · ${on.length ? on.join(', ') : 'silent'}`;
      }
      bus.on('mix:changed', render);
      render(engine.getState());

      const fill = document.getElementById('phase-fill');
      const phaseVal = document.getElementById('phase-val');
      function frame() {
        const p = engine.getOceanPhase();
        fill.style.width = `${p * 100}%`;
        phaseVal.textContent = p.toFixed(3);
        requestAnimationFrame(frame);
      }
      frame();

      window.engine = engine;
      console.log('[harness] engine on window.engine');
    </script>
  </body>
</html>
