<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Quietloom offline render</title></head>
  <body>
    <pre id="log">starting…</pre>
    <script type="module">
      /*
       * Renders the real audio engine through an OfflineAudioContext and POSTs
       * each result back as a WAV. No speakers involved, so this runs headless
       * and gives us something a human can actually listen to.
       */
      const SR = 44100;
      const log = (m) => {
        document.getElementById('log').textContent += '\n' + m;
        console.log(m);
      };

      // The engine reads window.AudioContext. Hand it an offline context whose
      // length we control, plus the two transport methods it expects to exist.
      let pending = null;
      class ShimContext extends OfflineAudioContext {
        constructor() {
          super(2, Math.ceil(SR * pending.seconds), SR);
        }
        resume() { return Promise.resolve(); }
        suspend() { return Promise.resolve(); }
      }
      window.AudioContext = ShimContext;
      window.webkitAudioContext = ShimContext;

      function encodeWav(buffer) {
        const chans = buffer.numberOfChannels;
        const frames = buffer.length;
        const data = new DataView(new ArrayBuffer(44 + frames * chans * 2));
        const put = (off, s) => { for (let i = 0; i < s.length; i++) data.setUint8(off + i, s.charCodeAt(i)); };
        put(0, 'RIFF');
        data.setUint32(4, 36 + frames * chans * 2, true);
        put(8, 'WAVEfmt ');
        data.setUint32(16, 16, true);
        data.setUint16(20, 1, true);
        data.setUint16(22, chans, true);
        data.setUint32(24, buffer.sampleRate, true);
        data.setUint32(28, buffer.sampleRate * chans * 2, true);
        data.setUint16(32, chans * 2, true);
        data.setUint16(34, 16, true);
        put(36, 'data');
        data.setUint32(40, frames * chans * 2, true);

        const src = [];
        for (let c = 0; c < chans; c++) src.push(buffer.getChannelData(c));
        let off = 44;
        for (let i = 0; i < frames; i++) {
          for (let c = 0; c < chans; c++) {
            const v = Math.max(-1, Math.min(1, src[c][i]));
            data.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7fff, true);
            off += 2;
          }
        }
        return data.buffer;
      }

      /** Peak, RMS and how much of the clip is near-silent. */
      function measure(buffer) {
        const d = buffer.getChannelData(0);
        let peak = 0, sum = 0, quiet = 0;
        const win = Math.floor(SR * 0.05);
        for (let i = 0; i < d.length; i++) {
          const a = Math.abs(d[i]);
          if (a > peak) peak = a;
          sum += d[i] * d[i];
        }
        for (let i = 0; i + win < d.length; i += win) {
          let w = 0;
          for (let j = 0; j < win; j++) w += d[i + j] * d[i + j];
          if (Math.sqrt(w / win) < 0.0005) quiet++;
        }
        const rms = Math.sqrt(sum / d.length);
        return {
          peak: +peak.toFixed(4),
          rms: +rms.toFixed(5),
          rmsDb: +(20 * Math.log10(rms || 1e-9)).toFixed(1),
          quietWindows: quiet,
        };
      }

      async function renderOne(job) {
        pending = job;
        // Fresh module instance per render so each gets its own context.
        const mod = await import(`/src/audio/engine.js?v=${encodeURIComponent(job.name)}`);
        const engine = new mod.AudioEngine();

        engine.applyMix({ layers: job.layers });
        engine.setMasterVolume(job.master ?? 0.8);
        await engine.start();

        const ctx = engine.getContext();
        const buf = await ctx.startRendering();
        const stats = measure(buf);

        await fetch('/save', {
          method: 'POST',
          headers: { 'x-name': job.name + '.wav' },
          body: encodeWav(buf),
        });
        log(`${job.name.padEnd(22)} peak ${String(stats.peak).padEnd(7)} rms ${String(stats.rmsDb).padEnd(7)}dB  silent-windows ${stats.quietWindows}`);
        return { name: job.name, ...stats };
      }

      const L = (id, volume, params) => ({ [id]: { enabled: true, volume, params: params || {} } });

      const JOBS = [
        { name: '01-rain',      seconds: 20, layers: L('rain', 0.85, { intensity: 0.55 }) },
        { name: '02-ocean',     seconds: 30, layers: L('ocean', 0.9) },
        { name: '03-wind',      seconds: 20, layers: L('wind', 0.85) },
        { name: '04-fire',      seconds: 20, layers: L('fire', 0.9) },
        { name: '05-crickets',  seconds: 20, layers: L('crickets', 0.9) },
        { name: '06-thunder',   seconds: 60, layers: L('thunder', 1.0, { frequency: 1.0 }) },
        { name: '07-pink',      seconds: 12, layers: L('pink', 0.8) },
        { name: '08-brown',     seconds: 12, layers: L('brown', 0.8) },
        { name: '09-white',     seconds: 12, layers: L('white', 0.8) },
        { name: '10-binaural',  seconds: 20, layers: L('binaural', 0.9, { baseHz: 250, beatHz: 4 }) },
        { name: '11-deeppulse', seconds: 25, layers: { ...L('deeppulse', 0.9), ...L('pink', 0.25) } },
        {
          name: '12-preset-rainfall', seconds: 25,
          layers: { ...L('rain', 0.72, { intensity: 0.5 }), ...L('pink', 0.3) },
        },
        {
          name: '13-preset-campfire', seconds: 25,
          layers: { ...L('fire', 0.8), ...L('crickets', 0.3), ...L('wind', 0.16) },
        },
        {
          name: '14-preset-rainy-cabin', seconds: 30,
          layers: {
            ...L('rain', 0.7, { intensity: 0.55 }),
            ...L('thunder', 0.4, { frequency: 0.9 }),
            ...L('wind', 0.22),
            ...L('fire', 0.3),
          },
        },
      ];

      const results = [];
      for (const job of JOBS) {
        try {
          results.push(await renderOne(job));
        } catch (err) {
          log(`FAIL ${job.name}: ${err && err.message}`);
          results.push({ name: job.name, error: String(err && err.message) });
        }
      }
      await fetch('/done', { method: 'POST', body: JSON.stringify(results) });
      log('ALL DONE');
    </script>
  </body>
</html>
