# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# This machine runs Norton, which intercepts TLS and re-signs every certificate with
# "Norton Web/Mail Shield Root". That CA is in the Windows certificate store but not in
# the JDK's cacerts, so without this Gradle cannot reach dl.google.com or Maven Central
# and every dependency fails with "PKIX path building failed".
#
# certs/cacerts-with-norton.jks is the JDK's own cacerts plus that one root. Regenerate
# it with scripts/fix-truststore.ps1 if the JDK changes or Norton rotates its CA.
# On a machine without TLS interception, delete these two lines.
systemProp.javax.net.ssl.trustStore=C:/Projects/MoneyMaker/android/certs/cacerts-with-norton.jks
systemProp.javax.net.ssl.trustStorePassword=changeit

# Faster incremental builds during the sprint. Note: org.gradle.caching is deliberately
# OFF — on Windows with antivirus active it fails packing the dex tree
# ("Could not get file mode for ...classes2.dex").
org.gradle.parallel=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
